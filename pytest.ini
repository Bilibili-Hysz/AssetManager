[pytest]
testpaths = tests
pythonpath = AssetsManager
# -n auto: run tests in parallel workers (pytest-xdist).  --dist loadgroup
# makes xdist_group("serial") markers EFFECTIVE: fixed-port tests (the 8765
# binders: test_server_lifecycle + test_security_preflight_*) and the visual
# baseline module stay on one worker and never run concurrently.  Under the
# previous --dist worksteal the group marker was silently ignored (C02).
# e2e/perf are excluded from the default run; opt in explicitly with
# `pytest -m e2e` / `pytest -m perf`.
# The root conftest assigns a unique per-process basetemp before collection.
# An explicitly supplied --basetemp remains under the caller's control.
addopts = -ra -n auto --dist loadgroup -m "not e2e and not perf" -W default -W ignore::ResourceWarning -W ignore::DeprecationWarning:tests.integration.test_library_service -W ignore::DeprecationWarning:tests.integration.test_event_publishing
# Per-test paths live below the owner directory and are removed with it.  This
# also makes AM_KEEP_TEST_RUNTIME_DATA retain them for diagnostics.
tmp_path_retention_policy = all
markers =
    smoke: minimal startup and integration smoke tests
    perf: baseline/performance sampling harnesses
    e2e: real-browser (Playwright) acceptance tests — opt in with `pytest -m e2e`
    stress: single-process load/concurrency and resource-stability tests (runs in the default suite; deselect with `-m "not stress"`)

# Test directory layout:
#   tests/unit/        — pure Python logic tests (domain, controllers, filters)
#   tests/integration/ — SQLite, filesystem, service integration tests
#   tests/desktop/     — PySide6 offscreen widget tests
#   tests/lan/         — aiohttp LAN route and security tests
#   tests/core/        — core infrastructure tests
#   tests/perf/        — performance baselines
