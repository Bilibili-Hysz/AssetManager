[pytest]
testpaths = tests
pythonpath = AssetsManager
# -n auto: run tests in parallel workers (pytest-xdist).  --dist worksteal
# balances task-level across workers; fixed-port tests (server_lifecycle's
# 8765) are marked xdist_group("serial") so they never run concurrently.
# e2e/perf are excluded from the default run; opt in explicitly with
# `pytest -m e2e` / `pytest -m perf`.
addopts = -ra -n auto --dist worksteal -m "not e2e and not perf" -W default -W ignore::ResourceWarning -W ignore::DeprecationWarning:tests.integration.test_library_service -W ignore::DeprecationWarning:tests.integration.test_event_publishing
markers =
    smoke: minimal startup and integration smoke tests
    perf: baseline/performance sampling harnesses
    e2e: real-browser (Playwright) acceptance tests — opt in with `pytest -m e2e`
    stress: single-process load/concurrency and resource-stability tests (runs in the default suite; deselect with `-m "not stress"`)

# Test directory layout:
#   tests/unit/        — pure Python logic tests (domain, controllers, filters)
#   tests/integration/ — SQLite, filesystem, service integration tests
#   tests/desktop/     — PySide6 offscreen widget tests
#   tests/lan/         — aiohttp LAN route and security tests
#   tests/core/        — core infrastructure tests
#   tests/perf/        — performance baselines
