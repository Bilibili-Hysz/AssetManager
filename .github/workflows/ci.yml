name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyright
      - run: pyright

  webui:
    name: WebUI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  package-smoke:
    name: Windows Package Smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install packaging dependencies
        run: pip install -r requirements.txt -r requirements-lan.txt -r requirements-dev.txt
      - name: Build PyInstaller bundle
        run: pyinstaller --noconfirm --clean AssetManager.spec
      - name: Verify bundled resources
        run: python scripts/check_package_contents.py dist/AssetManager

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-lan.txt
          pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall AssetsManager -q
      - name: Run tests
        run: python -m pytest -q --tb=short
