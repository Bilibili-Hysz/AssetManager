name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install packaging dependencies
        run: pip install -r requirements.txt -r requirements-lan.txt -r requirements-dev.txt
      - name: Build PyInstaller bundle
        shell: pwsh
        run: pyinstaller --noconfirm --clean AssetManager.spec
      - name: Verify bundled resources
        shell: pwsh
        run: python scripts/check_package_contents.py dist\AssetManager
      - name: Smoke-test frozen Qt imports and icon rendering
        shell: pwsh
        run: |
          $executable = Join-Path $env:GITHUB_WORKSPACE "dist\AssetManager\AssetManager.exe"
          $process = Start-Process -FilePath $executable -ArgumentList "--package-smoke" -WorkingDirectory (Split-Path $executable) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Frozen Qt/icon package smoke failed with code $($process.ExitCode)"
          }
      - name: Upload release artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "dist\AssetManager"
          $archive = Join-Path $env:RUNNER_TEMP "AssetManager-$($env:GITHUB_REF_NAME).zip"
          Compress-Archive -Path $bundle -DestinationPath $archive
          gh release upload "$env:GITHUB_REF_NAME" $archive --clobber
