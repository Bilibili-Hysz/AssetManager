name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Release gate: the tag build must not publish a bundle that the test
  # suite rejects. build-windows waits on this job (release.yml previously
  # built straight off the tag with no test prerequisite).
  pre-release-tests:
    name: Release Gate (lint + tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-lan.txt -r requirements-dev.txt
      - name: Ruff check
        run: ruff check AssetsManager tests scripts run.py build.py main.py setup_cython.py
      - name: Byte-compile
        run: python -m compileall -q AssetsManager tests
      - name: Run test suite
        run: python -m pytest -q -p no:cacheprovider

  build-windows:
    name: Build Windows Bundle
    needs: pre-release-tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install packaging dependencies
        run: pip install -r requirements.txt -r requirements-lan.txt -r requirements-dev.txt
      - name: Build PyInstaller bundle
        shell: pwsh
        run: pyinstaller --noconfirm --clean AssetManager.spec
      - name: Verify bundled resources
        shell: pwsh
        run: python scripts/check_package_contents.py dist\AssetManager.exe
      - name: Smoke-test frozen Qt imports and icon rendering
        shell: pwsh
        run: |
          $executable = Join-Path $env:GITHUB_WORKSPACE "dist\AssetManager.exe"
          $process = Start-Process -FilePath $executable -ArgumentList "--package-smoke" -WorkingDirectory (Split-Path $executable) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Frozen Qt/icon package smoke failed with code $($process.ExitCode)"
          }
      # Per-user Inno Setup installer (A2). Version comes from
      # AssetsManager/core/constants.py via scripts/build_installer.py, which
      # also stamps installer/_version.iss and self-checks the .iss script.
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build Windows installer
        shell: pwsh
        run: python scripts/build_installer.py
      - name: Prepare release artifact
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "dist\AssetManager.exe"
          $archiveName = "AssetManager-$($env:GITHUB_REF_NAME).zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $checksumName = "$archiveName.sha256"
          $checksum = Join-Path $env:RUNNER_TEMP $checksumName
          Compress-Archive -Path $bundle -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          "$hash  $archiveName" | Set-Content -LiteralPath $checksum -Encoding ascii
      - name: Transfer release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: |
            ${{ runner.temp }}/AssetManager-${{ github.ref_name }}.zip
            ${{ runner.temp }}/AssetManager-${{ github.ref_name }}.zip.sha256
          if-no-files-found: error
      - name: Transfer installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-installer
          path: |
            dist/installer/AssetManager-*-setup.exe
            dist/installer/AssetManager-*-setup.exe.sha256
          if-no-files-found: error

  publish-release:
    name: Publish Release Asset
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle
      - name: Download installer artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-installer
          path: ${{ runner.temp }}/release-installer
      - name: Verify and upload release artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archiveName = "AssetManager-$tag.zip"
          $checksumName = "$archiveName.sha256"
          $archive = Join-Path $env:RUNNER_TEMP "release-bundle\$archiveName"
          $checksum = Join-Path $env:RUNNER_TEMP "release-bundle\$checksumName"
          foreach ($path in @($archive, $checksum)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Release artifact was not downloaded: $path"
            }
          }

          $installers = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "release-installer") -Filter "AssetManager-*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer, found $($installers.Count)"
          }
          $installer = $installers[0]
          $installerName = $installer.Name
          $installerChecksumName = "$installerName.sha256"
          $installerChecksum = Join-Path $installer.DirectoryName $installerChecksumName
          if (-not (Test-Path -LiteralPath $installerChecksum -PathType Leaf)) {
            throw "Installer checksum was not downloaded: $installerChecksumName"
          }

          $releaseJson = gh release view $tag --repo "${{ github.repository }}" --json assets
          if ($LASTEXITCODE -ne 0) {
            throw "Release $tag does not exist in ${{ github.repository }}; refusing to create or target another release"
          }
          $release = $releaseJson | ConvertFrom-Json
          $uploadNames = @(
            $archiveName, $checksumName, $installerName, $installerChecksumName
          )
          $existingNames = @(
            $release.assets |
              Where-Object { $uploadNames -ccontains $_.name } |
              ForEach-Object { $_.name }
          )
          if ($existingNames.Count -gt 0) {
            throw "Release asset(s) already exist: $($existingNames -join ', '). Reruns are intentionally no-overwrite; delete the existing asset(s) before rerunning."
          }

          $recordedHash = (Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+' | Select-Object -First 1
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualHash -cne $recordedHash) {
            throw "SHA-256 mismatch for ${archiveName}: expected $recordedHash, got $actualHash"
          }

          $recordedInstallerHash = (Get-Content -LiteralPath $installerChecksum -Raw).Trim() -split '\s+' | Select-Object -First 1
          $actualInstallerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          if ($actualInstallerHash -cne $recordedInstallerHash) {
            throw "SHA-256 mismatch for ${installerName}: expected $recordedInstallerHash, got $actualInstallerHash"
          }

          gh release upload --repo "${{ github.repository }}" $tag $archive $checksum $installer.FullName $installerChecksum
          if ($LASTEXITCODE -ne 0) {
            throw "Release upload failed for $tag in ${{ github.repository }}"
          }
