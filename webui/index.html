<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the persisted theme before first paint to avoid a dark/light FOUC.
      // Mirrors webui/src/hooks/useTheme.ts (storage keys, values, and the
      // system preference fallback) and useServerTheme.ts (am_server_theme,
      // the follow-the-owner identity). The `lang` attribute is managed by JS
      // via webui/src/i18n/index.ts (setLang), so the HTML default stays "en".
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('am_theme');
          if (theme !== 'dark' && theme !== 'light') {
            theme = localStorage.getItem('assets-manager.gate-theme');
          }
        } catch (e) {
          theme = null;
        }
        var explicit = theme === 'dark' || theme === 'light';
        // Follow-the-owner pre-paint (A1): without an explicit visitor
        // preference, reuse the last server-reported owner theme so the
        // first paint already carries the library's palette identity.
        // /api/info corrects (or drops) the attribute once loaded.
        if (!explicit) {
          var remembered = null;
          try {
            remembered = JSON.parse(localStorage.getItem('am_server_theme') || 'null');
          } catch (e) {
            remembered = null;
          }
          if (
            remembered && typeof remembered.slug === 'string'
            && /^[a-z0-9]+(-[a-z0-9]+)*$/.test(remembered.slug)
          ) {
            document.documentElement.setAttribute('data-am-theme', remembered.slug);
            document.documentElement.classList.add(remembered.dark === false ? 'light' : 'dark');
            return;
          }
        }
        if (!explicit) {
          theme = (typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme === 'light' ? 'light' : 'dark');
      })();
    </script>
    <!-- Inter is self-hosted (webui/public/fonts/inter-var-latin.woff2) and
         declared via @font-face in src/index.css.  The LAN app must not block
         first paint on an external CDN: offline deployments previously waited
         on fonts.googleapis.com DNS/TLS timeouts before rendering anything. -->
    <title>AssetManager</title>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
