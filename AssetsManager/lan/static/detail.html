<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - AssetManager</title>
    <link rel="stylesheet" href="/static/style.css?v=20">
    <link rel="stylesheet" href="/static/detail.css?v=1">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-weight='bold'>A</text></svg>">
</head>
<body class="detail-page">
    <!-- Header -->
    <header class="detail-header">
        <div class="detail-header__left">
            <button class="detail-header__back" id="backBtn" title="Back to library">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span data-i18n="detail_page.back">Back</span>
            </button>
            <div class="detail-header__breadcrumb" id="breadcrumb"></div>
        </div>
        <div class="detail-header__right">
            <button class="detail-header__btn" id="downloadBtn" data-i18n-title="action.download" title="Download">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button class="detail-header__btn" id="shareBtn" data-i18n-title="action.share" title="Share">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="detail-main">
        <!-- Loading State -->
        <div class="detail-loading" id="loadingState">
            <div class="spinner"></div>
            <p data-i18n="detail_page.loading">Loading project...</p>
        </div>

        <!-- Error State -->
        <div class="detail-error" id="errorState" style="display:none">
            <div class="detail-error__icon">&#9888;</div>
            <h2 data-i18n="detail_page.project_not_found">Project Not Found</h2>
            <p id="errorMessage" data-i18n="detail_page.project_not_found_msg">The requested project could not be loaded.</p>
            <button class="btn btn--primary" id="errorBackBtn" data-i18n="detail_page.go_back">Go Back</button>
        </div>

        <!-- Project Content -->
        <div class="detail-content" id="projectContent" style="display:none">
            <!-- Hero Section -->
            <div class="detail-hero">
                <div class="detail-hero__preview" id="heroPreview">
                    <div class="detail-hero__placeholder">&#128193;</div>
                </div>
                <div class="detail-hero__info">
                    <h1 class="detail-hero__name" id="projectName">Project Name</h1>
                    <div class="detail-hero__meta" id="projectMeta"></div>
                    <div class="detail-hero__tags" id="projectTags"></div>
                    <div class="detail-hero__actions">
                        <button class="btn btn--primary" id="heroDownload">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            <span data-i18n="detail_page.download_all">Download All</span>
                        </button>
                        <button class="btn btn--secondary" id="heroShare">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                            <span data-i18n="detail_page.share">Share</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Links Section -->
            <div class="detail-section" id="linksSection" style="display:none">
                <h2 class="detail-section__title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
                    <span data-i18n="detail_page.links">Links</span>
                </h2>
                <div class="detail-links" id="linksList"></div>
            </div>

            <!-- Notes Section -->
            <div class="detail-section" id="notesSection" style="display:none">
                <h2 class="detail-section__title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    <span data-i18n="detail_page.notes">Notes</span>
                </h2>
                <div class="detail-notes" id="notesContent"></div>
            </div>

            <!-- Images Gallery -->
            <div class="detail-section" id="gallerySection" style="display:none">
                <h2 class="detail-section__title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <span data-i18n="detail_page.images">Images</span>
                </h2>
                <div class="detail-gallery" id="galleryGrid"></div>
            </div>

            <!-- Files Section -->
            <div class="detail-section">
                <h2 class="detail-section__title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                    <span data-i18n="detail_page.files">Files</span> <span class="detail-section__count" id="fileCount">0</span>
                </h2>
                <div class="detail-files" id="filesList"></div>
            </div>
        </div>
    </main>

    <!-- Image Viewer -->
    <div class="image-viewer" id="imageViewer">
        <span class="image-viewer__close" id="imageViewerClose">&times;</span>
        <button class="image-viewer__nav image-viewer__nav--prev" id="imageViewerPrev">&#10094;</button>
        <button class="image-viewer__nav image-viewer__nav--next" id="imageViewerNext">&#10095;</button>
        <img class="image-viewer__img" id="imageViewerImg" alt="">
        <div class="image-viewer__counter" id="imageViewerCounter"></div>
    </div>

    <!-- Share Dialog -->
    <div class="overlay" id="shareOverlay" style="display:none">
        <div class="auth-card share-card">
            <div class="auth-card__icon"><i data-lucide="link"></i></div>
            <div class="auth-card__title" data-i18n="share.create_title">Create Share Link</div>
            <div class="share-form">
                <label class="share-label" data-i18n="share.password_optional">Password (optional)</label>
                <input type="password" class="auth-card__input" id="sharePassword" data-i18n-placeholder="share.no_password_hint" placeholder="Leave empty for no password" autocomplete="off">
                <label class="share-label" data-i18n="share.expires_after">Expires After</label>
                <select class="auth-card__input" id="shareExpiry">
                    <option value="" data-i18n="share.never">Never</option>
                    <option value="1" data-i18n="share.1_hour">1 hour</option>
                    <option value="24" selected data-i18n="share.1_day">1 day</option>
                    <option value="168" data-i18n="share.7_days">7 days</option>
                    <option value="720" data-i18n="share.30_days">30 days</option>
                </select>
            </div>
            <div class="auth-card__error" id="shareError"></div>
            <div id="shareResult" style="display:none">
                <div class="share-result-url" id="shareUrl"></div>
                <button class="btn btn--primary btn--full" id="shareCopyBtn" data-i18n="share.copy_link">Copy Link</button>
            </div>
            <div id="shareActions">
                <button class="btn btn--primary btn--full" id="shareCreateBtn" data-i18n="share.create_link">Create Link</button>
                <button class="btn btn--secondary btn--full" id="shareCancelBtn" data-i18n="share.cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/i18n.js"></script>
    <script src="/static/icons.js"></script>
    <script src="/static/detail.js?v=2"></script>
    <script>
        I18N.init().then(() => I18N.applyToDOM());
    </script>
</body>
</html>
